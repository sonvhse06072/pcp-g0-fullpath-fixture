name: validation

on:
  pull_request:
    branches: [main, benchmark/fullpath, benchmark/fullpath-v2]
  # G1 immutable seed is intentionally NOT amended. Dispatch from main
  # to test one exact direct/PCP coding HEAD against the original seed SHA.
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact 40-hex G1-T01 direct/PCP candidate commit SHA'
        required: true
        type: string

permissions:
  contents: read

jobs:
  fixture-validation:
    name: fixture-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: db
          MARIADB_USER: db
          MARIADB_PASSWORD: db
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - name: Checkout exact candidate or PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
      - name: Verify exact supplied head before running tests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          echo "Fixture exact candidate/PR HEAD: $ACTUAL_HEAD"
      - name: Verify G1-T01 direct/PCP pair is seed-based and two-file scoped
        if: github.event_name == 'workflow_dispatch'
        env:
          IMMUTABLE_G1_SEED: d4f4a56713e95f85ecc08c02bb43a5b5105a86a3
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^')" = "$IMMUTABLE_G1_SEED"
          test "$(git rev-parse --verify "$IMMUTABLE_G1_SEED^{commit}")" = "$IMMUTABLE_G1_SEED"
          expected="$(printf '%s\n' \
            'web/modules/custom/pcp_f2_fixture/src/WindowOverlapDetector.php' \
            'web/modules/custom/pcp_f2_fixture/tests/src/Unit/WindowOverlapDetectorTest.php' \
            | LC_ALL=C sort)"
          actual="$(git diff --name-only "$IMMUTABLE_G1_SEED" HEAD | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --check "$IMMUTABLE_G1_SEED" HEAD
          echo "G1-T01 immutable seed and exactly two changed PHP paths: PASS"
      - name: PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, gd, pdo_mysql, xml, dom, zip, curl
          tools: composer:v2
          coverage: none
      - name: Verify dependency lock
        run: composer validate --strict --no-interaction
      - name: Install locked Drupal 11 dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify Drupal, PHPUnit and PHPCS
        run: |
          test -f web/core/tests/bootstrap.php
          test -x vendor/bin/phpunit
          test -x vendor/bin/phpcs
          test -f composer.lock
      - name: PHP syntax
        run: |
          find web/modules/custom/pcp_f2_fixture -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Drupal coding standard
        run: vendor/bin/phpcs --standard=Drupal web/modules/custom/pcp_f2_fixture
      - name: Drupal Unit tests
        env:
          SYMFONY_DEPRECATIONS_HELPER: disabled
        run: vendor/bin/phpunit -c web/core/phpunit.xml.dist web/modules/custom/pcp_f2_fixture/tests/src/Unit
      - name: Drupal Kernel tests
        env:
          SIMPLETEST_DB: mysql://db:db@127.0.0.1:3306/db
          SIMPLETEST_BASE_URL: http://127.0.0.1
          BROWSERTEST_OUTPUT_BASE_DIRECTORY: /tmp/pcp-f2-kernel
          SYMFONY_DEPRECATIONS_HELPER: disabled
        run: vendor/bin/phpunit -c web/core/phpunit.xml.dist web/modules/custom/pcp_f2_fixture/tests/src/Kernel
